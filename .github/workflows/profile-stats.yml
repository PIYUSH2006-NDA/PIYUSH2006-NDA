name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout latest repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # -----------------------------
      # Generate GitHub Stats
      # -----------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=piyush2006-nda&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Generate Top Languages
      # -----------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=piyush2006-nda&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Generate Contribution Streak
      # -----------------------------
      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=piyush2006-nda&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile statistics"

      # -----------------------------
      # Sync with latest main branch
      # -----------------------------
      - name: Sync with latest main
        run: |
          git pull --rebase origin main

      # -----------------------------
      # Push generated cards
      # -----------------------------
      - name: Push changes
        run: |
          git push origin HEAD:main
